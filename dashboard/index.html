<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a170c" />
    <title>El mapa de los perdidos</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="map" aria-label="Mapa del mundo con rastros, capturas, escapes y noclips"></canvas>
    <div id="grain" aria-hidden="true"></div>

    <aside id="panel">
      <header>
        <h1>El mapa de los perdidos</h1>
        <p class="sub">Por dónde anduvieron, dónde los atrapó La Interferencia y por dónde se escaparon.</p>
      </header>

      <div class="controls">
        <label>Seed
          <select id="seed"></select>
        </label>
        <label>Otra
          <input id="seed-custom" inputmode="numeric" pattern="\d*" placeholder="0 – 4294967295" />
        </label>
        <label>Nivel
          <select id="level"></select>
        </label>
        <label>Capa
          <select id="z"></select>
        </label>
      </div>

      <div class="stats" id="stats">
        <div class="stat"><span class="v" id="s-sesiones">—</span><span class="k">sesiones</span></div>
        <div class="stat"><span class="v" id="s-persecuciones">—</span><span class="k">persecuciones</span></div>
        <div class="stat"><span class="v" id="s-captura">—</span><span class="k">de captura</span></div>
        <div class="stat"><span class="v" id="s-duracion">—</span><span class="k">sesión media</span></div>
      </div>
      <p class="note" id="s-detalle"></p>

      <ul class="legend" id="legend"></ul>
      <p class="warn" id="warn" hidden></p>

      <details>
        <summary>Marcas de esta capa</summary>
        <table id="table">
          <thead><tr><th>Qué</th><th>Detalle</th><th>Cuándo (UTC)</th><th>Sesión</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
    </aside>

    <div id="zoom">
      <button id="zoom-in" aria-label="Acercar">+</button>
      <button id="zoom-out" aria-label="Alejar">−</button>
      <button id="zoom-fit" aria-label="Encuadrar">⌖</button>
    </div>
    <div id="tooltip" role="status" hidden></div>
    <p id="status"></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
